name: Python Static Code Quality & Syntax Linter

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_python_nodes:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Tree Code
      uses: actions/checkout@v4

    - name: Set Up Python 3.12 Runtime
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.12'

    - name: Install Linting Toolchains
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Enforce Strict Code Formatting Style (Black)
      run: |
        black --check --line-length 120 src/scripts/ src/src/edge_ai_controllers/

    - name: Analyze Code Semantics & Syntax Bugs (Flake8)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/src/edge_ai_controllers/ src/scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero on style warnings (warnings do not fail the integration pipeline)
        flake8 src/src/edge_ai_controllers/ src/scripts/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
