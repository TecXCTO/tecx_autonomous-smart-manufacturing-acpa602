# preempt_rt_6.1.46.config
# (Note: Real Linux kernel .config files contain over 10,000 flags. This template provides the critical overrides required to convert standard Linux into a hard real-time operating system [INDEX]).

# ==============================================================================
# TARGET INDUSTRIAL REALTIME OVERRIDES FOR KERNEL COMPILATION
# PREEMPT_RT 6.1.46 HARD SYSTEM ARCHITECTURE PROFILE CONFIG
# ==============================================================================
CONFIG_PREEMPT_BUILD=y
# CONFIG_PREEMPT_NONE is not set
# CONFIG_PREEMPT_VOLUNTARY is not set
# CONFIG_PREEMPT is not set
CONFIG_PREEMPT_RT=y
CONFIG_PREEMPT_COUNT=y
CONFIG_PREEMPTION=y

# Configure Core Timer Responsiveness Limits
CONFIG_HZ_1000=y
CONFIG_HZ=1000
CONFIG_HIGH_RES_TIMERS=y
CONFIG_TICK_ONESHOT=y
CONFIG_NO_HZ_COMMON=y
CONFIG_NO_HZ_FULL=y

# Optimize Memory Management Strategies to Eliminate Page Latency Spikes
CONFIG_LOCKUP_DETECTOR=y
CONFIG_HARDLOCKUP_DETECTOR=n
CONFIG_DETECT_HUNG_TASK=n
# CONFIG_COMPACTION is not set
# CONFIG_MIGRATION is not set
CONFIG_SLUB_HOMOGENEOUS=y
